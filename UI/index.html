<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css"/>
    <script src="js/app.js" defer></script>
    <title>DHL Tracking System</title>
</head>
<body>
    <h2>DHL Tracking</h2>
    <div class="container">
    <form id="file-upload">
        <div id="borders">
            <label id="upload-label">Track Single</label><br>
            <input type="text" placeholder="waybill number" id="single-track">
            <button id="track-single-btn" type="button">Track</button>
        </div>

            <div id="tracking-result" class="card" style="display: none;"></div>

        <div id="borders">
            <label id="upload-label">Upload a file</label><br>
            <input id="upload-file" type="file" accept=".csv, .xlsx, .xls">
            <button id="upload-btn" type="button">Upload</button>
        </div>
        
        <div id="borders">
            <label id="trigger-label">Trigger Automation</label>
            <button id="start-automation" type="button">Start</button>
        </div>

        <div id="borders">
            <label id="trigger-label">Report History</label>
            <input type="text" placeholder="batch_id" id="batch-id">
            <br>
            <br>
            <button id="get-report" type="button">Get Report</button>
            
        </div>
    </form>
    </div>
</body>
</html>
