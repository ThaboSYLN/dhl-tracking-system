<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Tracking System</title>
    <script src="/ui/js/app.js" defer></script>
    <link rel="stylesheet" href="/ui/css/style.css">

</head>
<body>
    <div class="header">
        <h1>DHL Tracking System</h1>
    </div>

    <div class="container">
        <!-- Track Single -->
        <div class="card">
            <h2 class="card-title">
                <span class="icon">📦</span>
                Track Single Package
            </h2>
            <div class="input-group">
                <input type="text" placeholder="Enter waybill number" id="single-track">
                <button id="track-single-btn">Track Package</button>
            </div>
            <div id="tracking-result" style="display: none;"></div>
        </div>

        <!-- Upload File -->
        <div class="card">
            <h2 class="card-title">
                <span class="icon">📄</span>
                Bulk Upload
            </h2>
            <div class="input-group">
                <input id="upload-file" type="file" accept=".csv, .xlsx, .xls">
                <button id="upload-btn">Upload & Process</button>
            </div>
        </div>

        <!-- Trigger Automation -->
        <div class="card">
            <h2 class="card-title">
                <span class="icon">⚡</span>
                Automation Control
            </h2>
            <button id="start-automation">Start Automation</button>
        </div>

        <!-- Report History -->
        <div class="card">
            <h2 class="card-title">
                <span class="icon">📊</span>
                Report History
            </h2>
            <div class="input-group">
                <input type="text" placeholder="Enter batch ID" id="batch-id">
                <button id="get-report">Get Report</button>
            </div>
        </div>
    </div>

</body>
</html>
